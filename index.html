<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./funciones/funcionesIndex/validacionCampos.js"></script>
    <script src="./funciones/funcionesIndex/MostrarPsw.js"></script>
    <title>Inicio</title>
</head>
<body>
    <header class="header-container">
        <div class="logo-containerBTZ"><img src="" alt=""></div>
        <div class="title-container">BIENVENIDO</div>
        <div class="logo-containerIPN"><img src="" alt=""></div>
    </header>
    <div class="container-main">
        <div class="container-form">
            <div class="container-title">
                <h2>Iniciar Sesión</h2>
            </div>
        <form action="" id="form">
            <label for="">Ingrese su numero de boleta</label>
            <input type="text" id="boleta" name="boleta" onkeypress="return ValidarCamposNumericos(event)" maxlength="10">
            <label for="">Ingrese su contraseña</label>
            <input type="password" id="password" name="password" onkeypress="return ValidarCamposPassword(event)" >
            <input type="checkbox" id="mostrar" onclick="VizualizarPsw('mostrar', 'password')"> <label for="">Mostrar Contraseña </label>
            <button type="submit" id="btn-login">Iniciar Sesión</button>
            <a href="">Recuperar contraseña?</a>
        </form>
        </div>
    </div>
</body>
</html>
