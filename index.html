<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <script src="./funciones/funcionesDeValidacion/validacionCampos.js"></script>
 <script src="./funciones/funcionesDeValidacion/MostrarPsw.js"></script>
 <script src="./funciones/funcionesIndex/funcionInicioSesion.js"></script>
    <title>Biblioteca Digital - Inicio</title>
    <link rel="stylesheet" href="./css/styleIndex.css">
</head>
<body>
    
    <header class="header-container">
        <div class="logo-containerBTZ">
            <img src="./img/logo-BTZ.png" alt="Logo BTZ">
        </div>
        <div class="title-container">
            BIENVENIDO A TU BIBLIOTECA DIGITAL
        </div>
        <div class="logo-containerIPN">
            <img src="./img/logo-IPN.png" alt="Logo IPN">
        </div>
    </header>

    
    <div class="container-main">
        <div class="container-form">
            
            <div class="container-title">
                <h2>INICIAR SESION</h2>
            </div>
            <form id="form"  method="post" onsubmit="iniciarSesion(event)">
                
                <label for="boleta">Usuario</label>
                <input 
                    type="text" 
                    id="boleta" 
                    name="boleta" 
                    placeholder="Ingrese su usuario"
                    onkeypress="return ValidarCamposNumericos(event)" 
                    maxlength="10"
                    required>

                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Ingrese su contraseña"
                    onkeypress="return ValidarCamposPassword(event)"
                    required>
                
                <div class="checkbox-container">
                    <input 
                        type="checkbox" 
                        id="mostrar" 
                        onclick="VizualizarPsw('mostrar', 'password')"
                    >
                    <label for="mostrar">Mostrar contraseña</label>
                </div>
                
                <button type="submit" class="btn-crear-cuenta" >ACCEDER</button>

                <div class="separator">O</div>
                
                <a href="./crear-cuenta.html" class="btn-crear-cuenta">Crear cuenta</a>

                
                <div class="divider"></div>


                <a href="./recuperar-contrasena.html" class="recuperar-contrasena">RECUPERAR CONTRASEÑA?</a>

            </form>
        </div>
    </div>
</body>
</html>
