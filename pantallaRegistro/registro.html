<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../funciones/funcionesDeValidacion/MostrarPsw.js"></script>
    <script src="../../funciones/funcionesDeValidacion/validacionCampos.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    
    <title>Registro</title>
</head>

<body>
    <header>
        <div class="logo-containerBTZ"><img src="" alt=""></div>
        <div class="title-container">REGISTRO</div>
        <div class="logo-containerIPN"><img src="" alt=""></div>
    </header>
    <div class="container-main">
        <div class="container-title">
            <h2>Crear una cuenta</h2>
        </div>
        <div class="container-form">
            <form action="" id="form-registro" onsubmit="return validarFormulario()">
                <label for="" class="text-label">Numero de boleta</label>

                <input type="text" class="input-field" id="boleta" name="boleta"
                    onkeypress="return ValidarCamposNumericos(event)" maxlength="10"
                    placeholder="Ingrese su numero de boleta">

                <label for="" class="text-label">Nombre(s)</label>
                <input type="text" class="input-field" id="nombre" name="nombre"
                    onkeypress="return ValidarCamposLetras(event)" maxlength="100" placeholder="Ingrese su nombre(s)">

                <label for="" class="text-label">Apellido(s)</label>

                <input type="text" class="input-field" id="apellidos" name="apellidos"
                    onkeypress="return ValidarCamposLetras(event)" maxlength="100" placeholder="Ingrese su apellido(s)">
                <label for="" class="text-label">Correo Institucional</label>

                <input type="email" class="input-field" id="correo" name="correo" maxlength="100"
                    placeholder="Ingrese su correo institucional">
                <label for="" class="text-label">Contraseña</label>
                <input type="password" class="input-field" id="contrasena" name="contrasena" maxlength="100"
                    placeholder="Ingrese su contraseña" onkeypress="return ValidarCamposPassword(event)">
                <label for="">Mostrar Contraseña </label> 
                <input type="checkbox" id="mostrar"
                    onclick="VizualizarPsw('mostrar', 'contrasena')">
                <label for="" class="text-label">Confirmacion de contraseña</label>
                <input type="password" class="input-field" id="confirmar_contrasena" name="confirmar_contrasena"
                    maxlength="100" placeholder="Ingrese nuevamente su contraseña"
                    onkeypress="return ValidarCamposPassword(event)">
                <button type="submit" id="btn-registrar">Registrar</button>
            </form>
        </div>
    </div>
</body>

</html>
