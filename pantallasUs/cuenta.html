<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Personal</title>
    <link rel="stylesheet" href="./css/EstiloAside.css">
    <link rel="stylesheet" href="./css/cuenta.css">
        <link rel="shortcut icon" href="/C-book-Proyecto/img/logo_C_Book.jpg" type="image/x-icon">
</head>
<body>
    <div class="container-main">
        <div class="container-aside">
            <script src="./funcionesHtml/asideConection.js"></script>
        </div>
        
        <div class="container-informacion">
            <div class="container-titulo">
                <h1>MI CUENTA</h1>
            </div>
            
            <div class="container-contenido">
                <div class="container-cuenta">
                    <h2>Información Personal</h2>
                    
                    <div class="layout-perfil">
                        <div class="container-foto-perfil">
                            <div class="logo-cuenta">
                                <!-- Aquí iría la imagen del usuario si existe -->
                            </div>
                            <div class="nombre-usuario">Nombre del Usuario</div>
                            <div class="rol-usuario">Estudiante</div>
                        </div>
                        
                        <div class="container-datos-usuario">
                            <h3>Datos Generales</h3>
                            
                            <div class="dato-item">
                                <label class="dato-label">BOLETA:</label>
                                <input type="text" class="dato-value" id="boleta" value="2022XXXX" readonly>
                            </div>
                            
                            <div class="dato-item">
                                <label class="dato-label">NOMBRE COMPLETO:</label>
                                <input type="text" class="dato-value" id="nombre-completo" value="Nombre Apellido Paterno Apellido Materno" readonly>
                            </div>
                            
                            <div class="dato-item">
                                <label class="dato-label">CORREO ELECTRÓNICO:</label>
                                <input type="email" class="dato-value" id="correo" value="usuario@ejemplo.com" readonly>
                            </div>
                            
                            <div class="dato-item">
                                <label class="dato-label">GRUPO:</label>
                                <input type="text" class="dato-value" id="grupo" value="6IM12" readonly>
                            </div>
                            
                            <div class="dato-item">
                                <label class="dato-label">CARRERA:</label>
                                <input type="text" class="dato-value" id="carrera" value="Ingeniería en Sistemas" readonly>
                            </div>
                            
                            <div class="container-btn-acciones">
                                <button class="btn-editar">EDITAR PERFIL</button>
                                <button class="btn-cambiar-password">CAMBIAR CONTRASEÑA</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
