<!D OCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Correo confirmado - C-Book</title>
    <link rel="stylesheet" href="css/confirmacionCorreo.css">
    <link rel="shortcut icon" href="../img/logo_C_Book.jpg" type="image/x-icon">
</head>
<body>
    <div class="background-decoration">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <main class="card" role="status" aria-live="polite">
        <div class="icon-container">
            <div class="icon-background"></div>
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
            </div>
        </div>

        <h1>¡Correo confirmado!</h1>
        <p class="subtitle">Tu cuenta de C-Book ya está activa.</p>

        <div class="success-details" style="margin-top: 1.5rem;">
            <div class="detail-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7B0233" stroke-width="2">
                    <rect x="3" y="4" width="18" height="16" rx="2" ry="2"/>
                    <polyline points="22 6 12 13 2 6"/>
                </svg>
                <span>Ya puedes volver a la aplicación y continuar con tus solicitudes.</span>
            </div>
        </div>

        <div class="footer" style="margin-top: 2rem;">
            <p>Gracias por formar parte de C-Book.</p>
        </div>
    </main>
</body>
</html>
