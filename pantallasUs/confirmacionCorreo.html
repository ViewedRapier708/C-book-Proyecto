<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Correo verificado</title>
    <style>
        :root{
            /* Toma variables globales si existen; usa respaldo si no */
            --app-bg: var(--color-bg, #f8fafc);
            --app-surface: var(--color-surface, #ffffff);
            --app-text: var(--color-text, #0f172a);
            --app-muted: var(--color-muted, #64748b);
            --app-primary: var(--color-primary, #2563eb);
            --app-on-primary: var(--color-on-primary, #ffffff);
            --app-success: var(--color-success, #16a34a);
            --app-border: var(--color-border, #e2e8f0);
        }
        * { box-sizing: border-box }
        body{
            margin:0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
            background: var(--app-bg);
            color: var(--app-text);
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card{
            width: 100%;
            max-width: 540px;
            background: var(--app-surface);
            border: 1px solid var(--app-border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
            padding: 32px;
        }
        .icon{
            width: 56px; height: 56px;
            background: color-mix(in srgb, var(--app-success) 12%, #fff);
            border-radius: 50%;
            display: grid; place-items: center;
            margin-bottom: 16px;
        }
        h1{ margin: 0 0 8px; font-size: clamp(20px, 3vw, 28px) }
        p{ margin: 0 0 12px }
        .hint{ color: var(--app-muted); font-size: 14px }
        .actions{ display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px }
      
        .footer{ margin-top: 24px; font-size: 13px; color: var(--app-muted) }

        @media (prefers-color-scheme: dark){
            :root{
                --app-bg: var(--color-bg, #0b1220);
                --app-surface: var(--color-surface, #0f172a);
                --app-text: var(--color-text, #e5e7eb);
                --app-muted: var(--color-muted, #94a3b8);
                --app-border: var(--color-border, #1f2937);
            }
            .card{ box-shadow: 0 10px 30px rgba(0,0,0,.4) }
            .icon{ background: color-mix(in srgb, var(--app-success) 20%, transparent) }
        }
    </style>
    <!-- Si tienes una hoja global (tema), puedes enlazarla aquí -->
    <!-- <link rel="stylesheet" href="css/StyleGeneral.css"> -->
</head>
<body>
    <main class="card" role="status" aria-live="polite">
        <div class="icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--app-success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14 9 11"/>
            </svg>
        </div>

        <h1>Correo verificado</h1>
        <p>Tu correo ha sido verificado con éxito.</p>
   

        <div class="footer">Su cuenta a sido creada con exito</div>
    </main>
</body>
</html>
