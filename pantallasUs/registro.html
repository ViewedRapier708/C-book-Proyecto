<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/registro.css">
    <link rel="icon" type="image/x-icon" href="/C-book-Proyecto/img//logo_C_Book.jpg">
    <script src="../funciones/funcionesDeValidacion/MostrarPsw.js"></script>
    <title>Registro</title>
</head>
<body>
    <header>
        <div class="logo-containerBTZ">
            <div class="logo-placeholder">LOGO BTZ</div>
            <img src="../img/logo-BTZ.png" alt="Logo BTZ">
        </div>
        <div class="title-container">REGISTRO DE CUENTA</div>
        <div class="logo-containerIPN">
            <div class="logo-placeholder">LOGO IPN</div>
            <img src="../img/logo-IPN.png" alt="Logo IPN">
        </div>
    </header>
    
    <div class="container-main">
     <!-- Contendor unif, no se pq no me dejaba poner comentarios jeje-->
        <div class="container-form-unified">
            <h2>Registro de cuenta</h2>
            
            <form id="form-registro">
                <!-- Boleta -->
                <div class="form-row full-width">
                    <label for="boleta" class="text-label">Número de boleta</label>
                    <input type="text" class="input-field" id="boleta" name="boleta" 
                           maxlength="10" placeholder="Ingrese su número de boleta">
                </div>
                
        
              
                
                <!-- Correo Institucional -->
                <div class="form-row full-width">
                    <label for="correo" class="text-label">Correo Institucional</label>
                    <input type="email" class="input-field" id="correo" name="correo" 
                           maxlength="100" placeholder="Ingrese su correo institucional">
                </div>
                
                <!-- Contraseña, Pug, eso te toca a ti -->
                <div class="form-row full-width">
                    <label for="contrasena" class="text-label">Contraseña</label>
                    <input type="password" class="input-field" id="contrasena" name="contrasena" 
                           maxlength="100" placeholder="Ingrese su contraseña">
                </div>
                
                <!-- Mostrar contraseña, igual el js -->
                <div class="form-row full-width checkbox-row">
                    <div class="checkbox-container">
                        <input type="checkbox" id="mostrar"   onclick="VizualizarPsw('mostrar', 'contrasena')">
                        <label for="mostrar" class="checkbox-label">Mostrar Contraseña</label>
                    </div>
                </div>
                
                <!-- Confirmar contraseña, cofirmar -->
                <div class="form-row full-width">
                    <label for="confirmar_contrasena" class="text-label">Confirmación de contraseña</label>
                    <input type="password" class="input-field" id="confirmar_contrasena" 
                           name="confirmar_contrasena" maxlength="100" 
                           placeholder="Ingrese nuevamente su contraseña">
                </div>
                
                <!-- Botón de registro -->
                <div class="form-row full-width">
                    <button type="submit" id="btn-registrar">
                        <a href="./cuenta.html">Registrar</a>
                    </button>
                  <button type="button" id="btn-registrar"><a href="../index.html">Regresar al inicio </a></button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="registro.js"></script>
</body>
</html>
