<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de correo</title>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
*{box-sizing:border-box}
html,body{height:100%}
body{
    margin:0;
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
    background:linear-gradient(135deg,#0f172a 0%,#0b1f3a 50%,#05233a 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#e6eef8;
    -webkit-font-smoothing:antialiased;
}
.container{
    width:100%;
    max-width:480px;
    padding:32px;
    border-radius:14px;
    background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
    box-shadow:0 8px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    text-align:center;
}
.icon{
    width:72px;height:72px;
    margin:0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#10b981,#06b6d4);
    border-radius:50%;
    box-shadow:0 8px 20px rgba(3,7,18,0.6);
}
h1{font-size:1.5rem;margin:0 0 8px;color:#fff}
p{margin:0 0 20px;color:rgba(255,255,255,0.85)}
.btn{
    display:inline-block;
    padding:10px 18px;
    border-radius:10px;
    background:#fff;
    color:#0b1f3a;
    font-weight:600;
    text-decoration:none;
    box-shadow:0 6px 18px rgba(11,31,58,0.35);
}
.btn.secondary{
    background:transparent;
    color:rgba(255,255,255,0.95);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:none;
    margin-left:10px;
}
.small{font-size:0.85rem;color:rgba(255,255,255,0.65);margin-top:12px}
@media (max-width:420px){.container{padding:22px}}
</style>

<div class="container" role="status" aria-live="polite">
    <div class="icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
            <path d="M3 8.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v.5L12 13l9-6.5V6z" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <h1>Confirma tu correo electrónico</h1>
    <p>Hemos enviado un correo a la dirección que proporcionaste. Revisa tu bandeja de entrada (y la carpeta de spam) y sigue el enlace para activar tu cuenta.</p>

    <a class="btn" href="../index.html">Ir al inicio</a>

    <div class="small">Si no recibes el correo en unos minutos, contacta al soporte.</div>
</div>
</body>
</html>
