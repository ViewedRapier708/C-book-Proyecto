    <script>
        (function () {
            const applyCellTooltips = (root) => {
                const scope = root || document;
                const tables = scope.querySelectorAll('.container-tabla table');

                tables.forEach((table) => {
                    const cells = table.querySelectorAll('th, td');

                    cells.forEach((cell) => {
                        const text = cell.textContent.trim();
                        if (!cell.dataset.fullText && text) {
                            cell.dataset.fullText = text;
                        }

                        const isTruncated = cell.scrollWidth > cell.clientWidth;
                        cell.dataset.truncated = isTruncated ? 'true' : 'false';

                        if (isTruncated) {
                            cell.title = cell.dataset.fullText || text;
                        } else {
                            cell.removeAttribute('title');
                        }
                    });
                });
            };

            document.addEventListener('DOMContentLoaded', () => {
                applyCellTooltips(document);

                const content = document.getElementById('content-loader');
                if (content) {
                    const observer = new MutationObserver(() => applyCellTooltips(content));
                    observer.observe(content, { childList: true, subtree: true });
                }
            });
        })();
    </script>
    <script>
        (function() {
            document.querySelectorAll('.navbar-dropdown-toggle').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var dropdown = btn.closest('.navbar-dropdown');
                    document.querySelectorAll('.navbar-dropdown.open').forEach(function(d) {
                        if (d !== dropdown) d.classList.remove('open');
                    });
                    dropdown.classList.toggle('open');
                });
            });
            document.addEventListener('click', function() {
                document.querySelectorAll('.navbar-dropdown.open').forEach(function(d) {
                    d.classList.remove('open');
                });
            });
        })();
    </script>
