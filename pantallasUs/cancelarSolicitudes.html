<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/solicitudRestiradores.css">
    <link rel="stylesheet" href="./css/EstiloAside.css">
    <title>Cancelar solicitudes</title>
</head>

<body>
    <div class="container-main">
        <div class="container-aside">
            <script src="./funcionesHtml/asideConection.js"></script>
        </div>

        <div class="container-informacion">
            <div class="container-titulo">
                <h1>SOLICITUDES ACTUALES</h1>
            </div>

            <div class="container-contenido">
                <div class="container-servicios">
                    <h2>SOLICITUDES</h2>

                    <div class="layout">
                        <div class="container-tabla">
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID Solicitud</th>
                                        <th>Tipo de Servicio</th>
                                        <th>Fecha de Solicitud</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="container-datos-usuario">
                            <h3>Datos del usuario</h3>
                            <div class="dato-item">
                                <span class="dato-label">No. de Boleta:</span>
                                <span class="dato-value">_________________</span>
                            </div>
                            <div class="dato-item">
                                <span class="dato-label">Nombre(s):</span>
                                <span class="dato-value">_________________</span>
                            </div>
                            <div class="dato-item">
                                <span class="dato-label">Apellido(s):</span>
                                <span class="dato-value">_________________</span>
                            </div>
                        </div>
                    </div>

                    <h3 class="nota-aviso">SI LA SOLICITUD SE REALIZO HACE MÁS DE 24 HORAS, NO SE PODRÁ CANCELAR</h3>

                    <div class="container-btn-apartar">
                        <button class="btn-apartar">Cancelar Solicitud</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
