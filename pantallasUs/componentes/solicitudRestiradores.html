<div class="container-solicitud-restiradores">
    <div class="user-cards-container" data-tipo="restirador" data-usa-cards="true">
        
        <!-- Filtros personalizados para restiradores -->
        <div class="user-filtros">
            <div class="user-filtros-grupo">
                <div class="user-filtro-item">
                    <label>Disponibilidad</label>
                    <select class="user-filtro-select" data-campo="Disponible">
                        <option value="">Todos</option>
                        <option value="true">Disponible</option>
                        <option value="false">Ocupado</option>
                    </select>
                </div>
            </div>
            <div class="user-acciones">
                <span class="user-contador" id="user-contador">0 elementos</span>
                <button class="user-btn-limpiar" onclick="limpiarFiltrosCards()">
                    <i class="fas fa-times"></i> Limpiar
                </button>
            </div>
        </div>
        
        <!-- Grid de cards -->
        <div class="user-grid user-grid-compact" id="user-cards-grid">
            <div class="user-cards-loading"></div>
        </div>
        
        <!-- Paginación -->
        <div class="user-paginacion" id="user-paginacion"></div>
        
        <!-- Botón de solicitud -->
        <div class="container-btn-apartar">
            <button class="btn-apartar" style="display: none;" onclick="window.abrirModal()">Solicitar recurso</button>
        </div>
    </div>
</div>

<!-- Modal de confirmación -->
<div id="modal-confirmacion" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <button class="btn-cerrar-modal" onclick="cerrarModal()">&times;</button>
        <h3>Detalles del Recurso</h3>
        <div id="detalles-recurso" class="detalles-recurso">
            <table class="tabla-detalles">
                <tbody id="tabla-detalles-body"></tbody>
            </table>
        </div>
        <div class="modal-acciones">
            <button id="btn-confirmar-solicitud" class="btn-apartar" onclick="confirmarSolicitud()">Apartar Recurso</button>
            <button id="btn-cancelar-solicitud" class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>
</div>
