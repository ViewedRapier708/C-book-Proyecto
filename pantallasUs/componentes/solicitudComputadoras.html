<div class="container-solicitud-computadoras">
 
    <div class="layout">
        <!-- Filtros se insertan aquí dinámicamente -->
        
        <div class="container-tabla">
            <table id="tabla" data-tipo="computadora">
                <thead>
                    <tr>
                        <th>No. Computadora</th>
                        <th>Carrera recomendada</th>
                        <th>Procesador</th>
                        <th>Lista de programas instalados</th>
                        <th>Observaciones</th>
                        <th>En funcionamiento</th>
                        <th>Disponible</th>
                    </tr>
                </thead>
                <tbody id="Tbody">

                </tbody>
            </table>
        </div>

        <!-- Botón de solicitud (aparece al seleccionar) -->
        <div class="container-btn-apartar">
            <button class="btn-apartar" onclick="window.abrirModal()">Solicitar recurso</button>
        </div>
    </div>
</div>

<!-- Modal de confirmación -->
<div id="modal-confirmacion" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <button class="btn-cerrar-modal" onclick="cerrarModal()">&times;</button>
        <h3>Detalles del Recurso</h3>
        <div id="detalles-recurso" class="detalles-recurso">
            <table class="tabla-detalles">
                <tbody id="tabla-detalles-body">
                    <!-- Los detalles se llenarán dinámicamente -->
                </tbody>
            </table>
        </div>
        <div class="modal-acciones">
            
            <button id="btn-confirmar-solicitud" class="btn-apartar" onclick="confirmarSolicitud()">Apartar
                Recurso</button>
            
                <button id="btn-cancelar-solicitud" class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>
</div>

<script src="./js/funcionsRecursos.js"></script>
