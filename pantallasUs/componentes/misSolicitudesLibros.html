<div class="container-solicitudes-libros-usuario">
    <div class="user-cards-container" data-tipo="solicitudes-libros" data-usa-cards="true">
        
        <!-- Filtros personalizados para solicitudes de libros -->
        <div class="user-filtros">
            <div class="user-filtros-grupo">
                <div class="user-filtro-item">
                    <label>Buscar libro</label>
                    <input type="text" class="user-filtro-input" data-campo="titulo" placeholder="Título del libro...">
                </div>
                <div class="user-filtro-item">
                    <label>Estado</label>
                    <select class="user-filtro-select" data-campo="estado">
                        <option value="">Todos</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="aprobado">Aprobado</option>
                        <option value="listo para recoger">Listo para recoger</option>
                        <option value="en préstamo">En préstamo</option>
                        <option value="rechazado">Rechazado</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                </div>
            </div>
            <div class="user-acciones">
                <span class="user-contador" id="user-contador">0 elementos</span>
                <button class="user-btn-limpiar" onclick="limpiarFiltrosCards()">
                    <i class="fas fa-times"></i> Limpiar
                </button>
            </div>
        </div>
        
        <!-- Grid de cards -->
        <div class="user-grid" id="user-cards-grid">
            <div class="user-cards-loading"></div>
        </div>
        
        <!-- Paginación -->
        <div class="user-paginacion" id="user-paginacion"></div>
    </div>
</div>
