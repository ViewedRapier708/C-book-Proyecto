<div class="container-solicitud-libros vista-tablas">
    <div class="layout">
        <!-- Sistema de Cards para Libros -->
        <div class="user-cards-container" data-usa-cards="true" data-tipo="libro">
            <!-- Filtros personalizados para libros -->
            <div class="user-filtros">
                <div class="user-filtros-grupo">
                    <div class="user-filtro-item">
                        <label for="filtro-busqueda-libro">
                            <i class="fas fa-search"></i>
                        </label>
                        <input type="text" 
                               id="filtro-busqueda-libro" 
                               class="user-filtro-input" 
                               placeholder="Buscar por título o autor..."
                               data-filtro="busqueda">
                    </div>
                    <div class="user-filtro-item">
                        <label for="filtro-tipo-material">
                            <i class="fas fa-layer-group"></i>
                        </label>
                        <select id="filtro-tipo-material" class="user-filtro-select" data-filtro="tipo_material">
                            <option value="">Todos los tipos</option>
                            <option value="libro">Libro</option>
                            <option value="revista">Revista</option>
                            <option value="tesis">Tesis</option>
                            <option value="periodico">Periódico</option>
                        </select>
                    </div>
                    <div class="user-filtro-item">
                        <label for="filtro-disponibilidad">
                            <i class="fas fa-check-circle"></i>
                        </label>
                        <select id="filtro-disponibilidad" class="user-filtro-select" data-filtro="disponibilidad">
                            <option value="">Todos</option>
                            <option value="disponible">Disponible</option>
                            <option value="no-disponible">No disponible</option>
                        </select>
                    </div>
                </div>
                <div class="user-acciones">
                    <button class="user-btn-limpiar" id="btn-limpiar-filtros" title="Limpiar filtros" onclick="limpiarFiltrosCards()">
                        <i class="fas fa-times"></i> Limpiar
                    </button>
                </div>
            </div>

            <!-- Contenedor del grid de cards -->
            <div class="user-grid grid-libros" id="user-cards-grid">
                <!-- Las cards se generan dinámicamente -->
            </div>

            <!-- Mensaje cuando no hay resultados -->
            <div id="mensajeSinResultados" class="mensaje-sin-resultados oculto">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                <p>No se encontraron libros con los filtros aplicados</p>
                <button id="btnResetearBusqueda" class="btn-resetear">Ver todos los libros</button>
            </div>

            <!-- Paginación -->
            <div class="user-paginacion" id="user-paginacion">
                <!-- Se genera dinámicamente -->
            </div>
        </div>

        <!-- Tabla oculta para compatibilidad con RealTime.js -->
        <table id="tabla" data-tipo="libro" style="display: none;">
            <thead>
                <tr>
                    <th>Titulo</th>
                    <th>Autor</th>
                    <th>Clasificacion</th>
                    <th>Tipo de material</th>
                    <th>Año</th>
                    <th>No. de ejemplar</th>
                    <th>Disponible</th>
                </tr>
            </thead>
            <tbody id="Tbody"></tbody>
        </table>

        <!-- Botón de solicitud (aparece al seleccionar) -->
        <div class="container-btn-apartar">
            <button class="btn-apartar" onclick="window.abrirModal()">Solicitar libro</button>
        </div>
    </div>
</div>

<!-- Modal de confirmación -->
<div id="modal-confirmacion" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <button class="btn-cerrar-modal" onclick="cerrarModal()">&times;</button>
        <h3>Detalles del Libro</h3>
        <div id="detalles-recurso" class="detalles-recurso">
            <table class="tabla-detalles">
                <tbody id="tabla-detalles-body">
                    <!-- Los detalles se llenarán dinámicamente -->
                </tbody>
            </table>
        </div>
        <div class="modal-acciones">
            <button id="btn-confirmar-solicitud" class="btn-apartar" onclick="confirmarSolicitud()">Apartar Libro</button>
            <button id="btn-cancelar-solicitud" class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>
</div>

<script src="./js/funcionsRecursos.js"></script>
