<div class="container-solicitud-libros">
    <div class="layout">
        <!-- Filtros se insertan aquí dinámicamente -->
        
        <div class="container-tabla">
            <table id="tabla" data-tipo="libro">
                <thead>
                    <tr>
                        <th>Titulo</th>
                        <th>Autor</th>
                        <th>Clasificacion</th>
                        <th>Tipo de material</th>
                        <th>Año</th>
                        <th>No. de ejemplar</th>
                        <th>Disponible</th>
                    </tr>
                </thead>
                <tbody id="Tbody">

                </tbody>
            </table>
            <div id="mensajeSinResultados" class="mensaje-sin-resultados oculto">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <p>No se encontraron libros con los filtros aplicados</p>
                <button id="btnResetearBusqueda" class="btn-resetear">Ver todos los libros</button>
            </div>
        </div>

        <!-- Botón de solicitud (aparece al seleccionar) -->
        <div class="container-btn-apartar">
            <button class="btn-apartar" onclick="window.abrirModal()">Solicitar recurso</button>
        </div>
    </div>
</div>

<!-- Modal de confirmación -->
<div id="modal-confirmacion" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <button class="btn-cerrar-modal" onclick="cerrarModal()">&times;</button>
        <h3>Detalles del Recurso</h3>
        <div id="detalles-recurso" class="detalles-recurso">
            <table class="tabla-detalles">
                <tbody id="tabla-detalles-body">
                    <!-- Los detalles se llenarán dinámicamente -->
                </tbody>
            </table>
        </div>
        <div class="modal-acciones">
            <button id="btn-confirmar-solicitud" class="btn-apartar" onclick="confirmarSolicitud()">Apartar
                Recurso</button>
            <button id="btn-cancelar-solicitud" class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <!-- Modal de confirmación -->
    <div id="modal-confirmacion" class="modal-overlay">
        <div class="modal-content">
            <h3>Confirmar Solicitud</h3>
            <div id="detalles-recurso" class="detalles-recurso">
                <!-- Se llenará dinámicamente -->
            </div>
            <div class="modal-acciones">
                <button id="btn-confirmar-solicitud" class="btn-apartar">Apartar</button>
                <button id="btn-cancelar-solicitud" class="btn-cancelar">Cancelar solicitud</button>
            </div>
        </div>
    </div>

    <script src="./js/funcionsRecursos.js"></script>
