<div class="container-solicitud-libros">
    <h2>SOLICITUD DE LIBROS</h2>
    <div class="layout">
        <div class="container-tabla">
             <table id="tabla" data-tipo="libros">
                <thead >
                    <tr >
                        <th>Titulo</th>
                        <th>Autor</th>
                        <th>Año</th>
                        <th>Tipo de material</th>
                        <th>Cant. Disponible</th>
                    </tr>
                </thead>
                <tbody id="Tbody">
                    
                </tbody>
            </table>
            <div class="container-btn-apartar">
                <button class="btn-apartar" onclick="window.abrirModal()">Solicitar</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal de confirmación -->
<div id="modal-confirmacion" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <button class="btn-cerrar-modal" onclick="cerrarModal()">&times;</button>
        <h3>Detalles del Recurso</h3>
        <div id="detalles-recurso" class="detalles-recurso">
            <table class="tabla-detalles">
                <tbody id="tabla-detalles-body">
                    <!-- Los detalles se llenarán dinámicamente -->
                </tbody>
            </table>
        </div>
        <div class="modal-acciones">
            <button id="btn-confirmar-solicitud" class="btn-apartar" onclick="confirmarSolicitud()">Apartar Recurso</button>
            <button id="btn-cancelar-solicitud" class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <!-- Modal de confirmación -->
    <div id="modal-confirmacion" class="modal-overlay">
        <div class="modal-content">
            <h3>Confirmar Solicitud</h3>
            <div id="detalles-recurso" class="detalles-recurso">
                <!-- Se llenará dinámicamente -->
            </div>
            <div class="modal-acciones">
                <button id="btn-confirmar-solicitud" class="btn-apartar">Apartar</button>
                <button id="btn-cancelar-solicitud" class="btn-cancelar">Cancelar solicitud</button>
            </div>
        </div>
    </div>

    <script src="./js/funcionsRecursos.js"></script>
