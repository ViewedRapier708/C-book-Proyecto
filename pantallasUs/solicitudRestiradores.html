<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/EstiloAside.css">
     <link rel="stylesheet" href="./css/StyleGeneral.css">
     <script src="./funcionesHtml/tbTgl.js"></script>
     <script src="./funcionesHtml/ventanaEmergenteDatos.js"></script>
    <title>Solicitud de Restiradores</title>
        <link rel="shortcut icon" href="/C-book-Proyecto/img/logo_C_Book.jpg" type="image/x-icon">
</head>
<body>
    <div class="container-main">
        <div class="container-aside">
         <script src="./funcionesHtml/asideConection.js"></script>
        </div>

        <div class="container-informacion">
            <div class="container-titulo">
                <h1>PANTALLA DE SOLITUD DE RESTIRADORES</h1>
            </div>
            
            <div class="container-contenido">
                <div class="container-servicios">
                    <h2>RESTIRADORES</h2>
                    
                    <div class="layout">
                        <div class="container-tabla">
                            <table id="tabla" data-tipo="restiradores">
                                <thead>
                                    <tr>
                                        <th>No. Restirador</th>
                                        <th>Disponibilidad</th>
                                    </tr>
                                </thead>
                                <tbody>
                                   
                                        
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="container-datos-usuario">
                            <h3>Datos del usuario</h3>
                            <div class="dato-item">
                                <span class="dato-label">No. boleta:</span>
                                <span class="dato-value">_________________</span>
                            </div>
                            <div class="dato-item">
                                <span class="dato-label">Nombre(s):</span>
                                <span class="dato-value">_________________</span>
                            </div>
                            <div class="dato-item">
                                <span class="dato-label">Apellido(s):</span>
                                <span class="dato-value">_________________</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="container-btn-apartar">
                        <button class="btn-apartar" onclick="mostrarVentanaEmergenteDatos()">APARTAR RESTIRADOR</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
        <script src="./js/funcionsRecursos.js"></script>
        <script>
  window.addEventListener("DOMContentLoaded", function() {
    const tabla = document.getElementById("tabla");
    let filaSeleccionada = null;

    tabla.addEventListener("click", (event) => {
      if (event.target.tagName === "TD") {
        const fila = event.target.parentNode;

        if (filaSeleccionada) filaSeleccionada.style.backgroundColor = "";
        fila.style.backgroundColor = "#d0ebff";
        filaSeleccionada = fila;

        const celdas = fila.querySelectorAll("td");
        const numeroBoleta = celdas[0].textContent.trim();
        const materialSeleccionado = celdas[1].textContent.trim();

        // Abrir modal con esos datos
        mostrarVentanaEmergenteDatos(numeroBoleta, materialSeleccionado);
      }
    });
  });
</script>
    
</body>
</html>
