<div class="admin-cards-container container-documentos">
    <h2>Gestión de Documentación de Usuarios</h2>
    <div class="mensaje-alerta" id="mensaje-documentos" hidden></div>

    <div class="admin-header">
        <div class="admin-filtros">
            <label for="filtro-documentos">Filtrar:</label>
            <select id="filtro-documentos" class="admin-filtro-select" onchange="filtrarDocumentos()">
                <option value="todos">Todos</option>
                <option value="sin-docs" selected>Sin documentación (Pendientes)</option>
                <option value="con-docs">Con documentación (Aprobados)</option>
            </select>
            <input type="text" id="buscar-documentos" class="admin-search-input" placeholder="Buscar boleta, correo..." oninput="debouncedFiltrarDocumentos()">
            <span class="admin-contador" id="contador-documentos"></span>
        </div>
        <div class="admin-acciones">
            <button class="btn-recargar" onclick="cargarDocumentos()">
                <i class="fas fa-sync-alt"></i> Recargar
            </button>
        </div>
    </div>

    <div class="admin-carousel" id="carousel-documentos">
        <button class="admin-arrow admin-arrow-prev" onclick="anteriorPaginaDocumentos()" aria-label="Anterior">
            <i class="fas fa-chevron-left"></i>
        </button>
        
        <div class="admin-grid admin-grid-6" id="grid-documentos">
            <!-- Carga dinámica de cards -->
        </div>
        
        <button class="admin-arrow admin-arrow-next" onclick="siguientePaginaDocumentos()" aria-label="Siguiente">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <div class="admin-paginacion" id="paginacion-documentos">
        <div class="admin-paginacion-dots" id="paginacion-dots-documentos"></div>
        <div class="admin-paginacion-contador" id="paginacion-contador-documentos">0 / 0</div>
    </div>

    <div class="admin-estadisticas">
        <div class="estadistica-item">
            <span class="estadistica-valor" id="total-pendientes">0</span>
            <span class="estadistica-label">Pendientes</span>
        </div>
        <div class="estadistica-item">
            <span class="estadistica-valor" id="total-aprobados">0</span>
            <span class="estadistica-label">Aprobados</span>
        </div>
        <div class="estadistica-item">
            <span class="estadistica-valor" id="total-documentos">0</span>
            <span class="estadistica-label">Total</span>
        </div>
    </div>
</div>
