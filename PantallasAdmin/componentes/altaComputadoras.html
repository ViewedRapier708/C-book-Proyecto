<div class="admin-cards-container">
    <h2>Gestión de Computadoras</h2>
    <div class="mensaje-alerta" id="mensaje-computadoras" hidden></div>

    <div class="admin-header">
        <div class="admin-filtros">
            <label for="filtro-computadoras">Filtrar:</label>
            <select id="filtro-computadoras" class="admin-filtro-select" onchange="filtrarComputadoras()">
                <option value="todos">Todos</option>
                <option value="disponible">Disponibles</option>
                <option value="no-disponible">No disponibles</option>
                <option value="funcionando">En funcionamiento</option>
                <option value="fuera-servicio">Fuera de servicio</option>
            </select>
            <input type="text" id="buscar-computadoras" class="admin-search-input" placeholder="Buscar procesador, carrera..." oninput="debouncedFiltrarComputadoras()">
            <span class="admin-contador" id="contador-computadoras"></span>
        </div>
        <div class="admin-acciones">
            <button class="btn-recargar" onclick="cargarComputadoras()">
                <i class="fas fa-sync-alt"></i> Recargar
            </button>
            <button class="btn-alta" id="btn-agregar">
                <i class="fas fa-plus"></i> Agregar Computadora
            </button>
        </div>
    </div>

    <div class="admin-carousel" id="carousel-computadoras">
        <button class="admin-arrow admin-arrow-prev" onclick="anteriorPaginaComputadoras()" aria-label="Anterior">
            <i class="fas fa-chevron-left"></i>
        </button>
        
        <div class="admin-grid admin-grid-4" id="grid-computadoras">
            <!-- Carga dinámica de cards -->
        </div>
        
        <button class="admin-arrow admin-arrow-next" onclick="siguientePaginaComputadoras()" aria-label="Siguiente">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <div class="admin-paginacion" id="paginacion-computadoras">
        <div class="admin-paginacion-dots" id="paginacion-dots-computadoras"></div>
        <div class="admin-paginacion-contador" id="paginacion-contador-computadoras">0 / 0</div>
    </div>
</div>

<!-- MODAL - Formulario como ventana emergente -->
<div class="modal-overlay" id="modalFormulario">
    <div class="modal-contenido">
        <span class="modal-cerrar">&times;</span>
        <h3 id="modal-titulo">Nueva Computadora</h3>
        
        <div class="container-formulario">
            <input type="hidden" id="computadora_id">
            <div class="form-group">
                <label for="procesador">Procesador:</label>
                <input type="text" id="procesador" placeholder="Ingrese el procesador">
            </div>
            <div class="form-group">
                <label for="programas">Programas Instalados:</label>
                <textarea id="programas" rows="3" placeholder="Ingrese los programas instalados"></textarea>
            </div>
            <div class="form-group">
                <label for="carrera">Carrera Especializada:</label>
                <input type="text" id="carrera" placeholder="Ingrese la carrera">
            </div>
            <div class="form-group">
                <label for="disponible">Disponible:</label>
                <select id="disponible">
                    <option value="true">Sí</option>
                    <option value="false">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="en_funcionamiento">En funcionamiento:</label>
                <select id="en_funcionamiento">
                    <option value="true">Sí</option>
                    <option value="false">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="observacion">Observación:</label>
                <input type="text" id="observacion" placeholder="Ingrese la observación">
            </div>
            <div class="form-group">
                <label for="no_inventario">No. Inventario:</label>
                <input type="text" id="no_inventario" placeholder="Ingrese el número de inventario">
            </div>
            <div class="form-group">
                <label for="no_computadora">No. Computadora:</label>
                <input type="number" id="no_computadora" placeholder="Ingrese el número de computadora">
            </div>
        </div>
        
        <div class="modal-botones">
            <button class="btn-limpiar" id="btn-limpiar">Limpiar</button>
            <button class="btn-guardar" id="btn-guardar">Guardar</button>
        </div>
    </div>
</div>
