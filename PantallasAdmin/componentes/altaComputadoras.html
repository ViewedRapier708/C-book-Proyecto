<div class="container-computadoras">
    <h2>Registro de Nueva Computadora</h2>
  
    <div class="layout-dos-columnas">
        <!-- Columna Izquierda: Tabla -->
        <div class="columna-principal">
            <div class="container-tabla">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>No.</th>
                                <th>Procesador</th>
                                <th>RAM</th>
                                <th>Carrera</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>001</td>
                                <td>Intel Core i5</td>
                                <td>8GB</td>
                                <td>Sistemas</td>
                                <td>Disponible</td>
                                <td><button class="btn-editar">Editar</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="container-btn-alta">
                <button class="btn-alta" id="btn-agregar">Agregar Computadora</button>
            </div>
        </div>
        
        <!-- Columna Derecha: Estadísticas (siempre visible) -->
        <div class="columna-estadisticas">
            <div class="container-datos-sistema">
                <h3>Información del Sistema</h3>
                <div class="dato-item">
                    <span class="dato-label">Total Computadoras:</span>
                    <span class="dato-value">25</span>
                </div>
                <div class="dato-item">
                    <span class="dato-label">Disponibles:</span>
                    <span class="dato-value">18</span>
                </div>
                <div class="dato-item">
                    <span class="dato-label">En Uso:</span>
                    <span class="dato-value">5</span>
                </div>
                <div class="dato-item">
                    <span class="dato-label">Mantenimiento:</span>
                    <span class="dato-value">2</span>
                </div>
                <div class="dato-item">
                    <span class="dato-label">Última Actualización:</span>
                    <span class="dato-value">13/11/2025</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL - Formulario como ventana emergente -->
<div class="modal-overlay" id="modalFormulario">
    <div class="modal-contenido">
        <span class="modal-cerrar">&times;</span>
        <h3 id="modal-titulo">Nueva Computadora</h3>
        
        <div class="container-formulario">
            <div class="form-group">
                <label for="procesador">Procesador:</label>
                <input type="text" id="procesador" placeholder="Ingrese el procesador">
            </div>
            <div class="form-group">
                <label for="programas">Programas Instalados:</label>
                <textarea id="programas" rows="3" placeholder="Ingrese los programas instalados"></textarea>
            </div>
            <div class="form-group">
                <label for="carrera">Carrera Especializada:</label>
                <select id="carrera">
                    <option value="">Seleccione una carrera</option>
                    <option value="Sistemas Digitales">Sistemas Digitales</option>
                    <option value="Programación">Programación</option>
                    <option value="Mecatronica">Mecatrónica</option>
                    <option value="tronco-comun">Tronco Común</option>
                </select>
            </div>
            <div class="form-group">
                <label for="ram">Memoria RAM:</label>
                <input type="text" id="ram" placeholder="Ej: 8GB, 16GB">
            </div>
            <div class="form-group">
                <label for="estado">Estado:</label>
                <select id="estado">
                    <option value="disponible">Disponible</option>
                    <option value="ocupada">Ocupada</option>
                    <option value="mantenimiento">En Mantenimiento</option>
                </select>
            </div>
        </div>
        
        <div class="modal-botones">
            <button class="btn-limpiar" id="btn-limpiar">Limpiar</button>
            <button class="btn-guardar" id="btn-guardar">Guardar</button>
        </div>
    </div>
</div>
