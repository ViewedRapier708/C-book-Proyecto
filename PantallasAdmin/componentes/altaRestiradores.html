<div class="container-restiradores">
    <div class="mensaje-alerta" id="mensaje-restiradores" hidden></div>

    <div class="layout-dos-columnas">
        <div class="columna-principal">
            <div class="tabla-encabezado">
                <div class="tabla-info">
                    <span class="tabla-total" data-total="restiradores">Total: 0</span>
                </div>
                <div class="tabla-acciones">
                    <button class="btn-recargar" data-recargar="restiradores">Recargar</button>
                </div>
            </div>
            <div class="container-tabla">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>No. Restirador</th>
                                <th>No. Inventario</th>
                                <th>Disponible</th>
                                <th>Estado material</th>
                                <th>Observación</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-restiradores"></tbody>
                    </table>
                </div>
            </div>

            <div class="paginacion" data-paginacion="restiradores">
                <button class="btn-paginacion" data-prev>Anterior</button>
                <span class="pagina-actual">Página 1</span>
                <button class="btn-paginacion" data-next>Siguiente</button>
            </div>
            
            <div class="container-btn-alta">
                <button class="btn-alta" id="btn-agregar">Agregar Restiradores</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL - Formulario como ventana emergente -->
<div class="modal-overlay" id="modalFormulario">
    <div class="modal-contenido">
        <span class="modal-cerrar">&times;</span>
        <h3 id="modal-titulo">Nuevo Restirador</h3>
        
        <div class="container-formulario">
            <input type="hidden" id="restirador_id">
            <div class="form-group">
                <label for="disponible">Disponible:</label>
                <select id="disponible">
                    <option value="true">Sí</option>
                    <option value="false">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="estado_material">Estado de material:</label>
                <select id="estado_material">
                    <option value="true">Funcional</option>
                    <option value="false">Dañado</option>
                </select>
            </div>
            <div class="form-group">
                <label for="observacion">Observación:</label>
                <input type="text" id="observacion" placeholder="Ingrese la observación">
            </div>
            <div class="form-group">
                <label for="no_inventario">No. Inventario:</label>
                <input type="text" id="no_inventario" placeholder="Ingrese el número de inventario">
            </div>
            <div class="form-group">
                <label for="no_restirador">No. Restirador:</label>
                <input type="number" id="no_restirador" placeholder="Ingrese el número de restirador">
            </div>
        </div>
        <div class="modal-botones">
            <button class="btn-limpiar" id="btn-limpiar">Limpiar</button>
            <button class="btn-guardar" id="btn-guardar">Guardar</button>
        </div>
    </div>
</div>
