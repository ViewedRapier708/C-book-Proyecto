<div class="container-restiradores">
    <h2>Registro de Nuevos Restiradores</h2>
    
    <div class="layout-dos-columnas">
        <!-- Columna Izquierda: Tabla -->
        <div class="columna-principal">
            <div class="container-tabla">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>No. Restirador</th>
                                <th>No. Inventario</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="4">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="container-btn-alta">
                <button class="btn-alta" id="btn-agregar">➕ Agregar Restirador</button>
            </div>
        </div>
        
        <!-- Columna Derecha: Estadísticas -->
        <div class="columna-estadisticas">
            <div class="container-datos-sistema">
                <h3>Estadísticas Restiradores</h3>
                <div class="dato-item">
                    <span class="dato-label">Cargando...</span>
                    <span class="dato-value">...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL - Formulario como ventana emergente -->
<div class="modal-overlay" id="modalFormulario">
    <div class="modal-contenido">
        <span class="modal-cerrar">&times;</span>
        <h3 id="modal-titulo">Nuevo Restirador</h3>
        
        <div class="container-formulario">
            <div class="form-group">
                <label for="no_inventario">No. Inventario: *</label>
                <input type="text" id="no_inventario" placeholder="Ej: INV-REST-001" required>
            </div>
            <div class="form-group">
                <label for="no_restirador">No. Restirador: *</label>
                <input type="number" id="no_restirador" placeholder="Ej: 1" min="1" required>
            </div>
            <div class="form-group">
                <label for="observacion">Observación:</label>
                <textarea id="observacion" rows="3" placeholder="Observaciones adicionales"></textarea>
            </div>
        </div>
        <div class="modal-botones">
            <button class="btn-limpiar" id="btn-limpiar">🧹 Limpiar</button>
            <button class="btn-guardar" id="btn-guardar">💾 Guardar</button>
        </div>
    </div>
</div>

<script src="../PantallasAdmin/js/gestionRestiradores.js"></script>
