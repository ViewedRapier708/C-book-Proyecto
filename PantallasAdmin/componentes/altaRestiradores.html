<div class="admin-cards-container">
    <h2>Gestión de Restiradores</h2>
    <div class="mensaje-alerta" id="mensaje-restiradores" hidden></div>

    <div class="admin-header">
        <div class="admin-filtros">
            <label for="filtro-restiradores">Filtrar:</label>
            <select id="filtro-restiradores" class="admin-filtro-select" onchange="filtrarRestiradores()">
                <option value="todos">Todos</option>
                <option value="disponible">Disponibles</option>
                <option value="no-disponible">No disponibles</option>
                <option value="funcional">Funcional</option>
                <option value="danado">Dañado</option>
            </select>
            <input type="text" id="buscar-restiradores" class="admin-search-input" placeholder="Buscar inventario..." oninput="debouncedFiltrarRestiradores()">
            <span class="admin-contador" id="contador-restiradores"></span>
        </div>
        <div class="admin-acciones">
            <button class="btn-recargar" onclick="cargarRestiradores()">
                <i class="fas fa-sync-alt"></i> Recargar
            </button>
            <button class="btn-alta" id="btn-agregar">
                <i class="fas fa-plus"></i> Agregar Restirador
            </button>
        </div>
    </div>

    <div class="admin-carousel" id="carousel-restiradores">
        <button class="admin-arrow admin-arrow-prev" onclick="anteriorPaginaRestiradores()" aria-label="Anterior">
            <i class="fas fa-chevron-left"></i>
        </button>
        
        <div class="admin-grid admin-grid-6" id="grid-restiradores">
            <!-- Carga dinámica de cards -->
        </div>
        
        <button class="admin-arrow admin-arrow-next" onclick="siguientePaginaRestiradores()" aria-label="Siguiente">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <div class="admin-paginacion" id="paginacion-restiradores">
        <div class="admin-paginacion-dots" id="paginacion-dots-restiradores"></div>
        <div class="admin-paginacion-contador" id="paginacion-contador-restiradores">0 / 0</div>
    </div>
</div>

<!-- MODAL - Formulario como ventana emergente -->
<div class="modal-overlay" id="modalFormulario">
    <div class="modal-contenido">
        <span class="modal-cerrar">&times;</span>
        <h3 id="modal-titulo">Nuevo Restirador</h3>
        
        <div class="container-formulario">
            <input type="hidden" id="restirador_id">
            <div class="form-group">
                <label for="disponible">Disponible:</label>
                <select id="disponible">
                    <option value="true">Sí</option>
                    <option value="false">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="estado_material">Estado de material:</label>
                <select id="estado_material">
                    <option value="true">Funcional</option>
                    <option value="false">Dañado</option>
                </select>
            </div>
            <div class="form-group">
                <label for="observacion">Observación:</label>
                <input type="text" id="observacion" placeholder="Ingrese la observación">
            </div>
            <div class="form-group">
                <label for="no_inventario">No. Inventario:</label>
                <input type="text" id="no_inventario" placeholder="Ingrese el número de inventario">
            </div>
            <div class="form-group">
                <label for="no_restirador">No. Restirador:</label>
                <input type="number" id="no_restirador" placeholder="Ingrese el número de restirador">
            </div>
        </div>
        <div class="modal-botones">
            <button class="btn-limpiar" id="btn-limpiar">Limpiar</button>
            <button class="btn-guardar" id="btn-guardar">Guardar</button>
        </div>
    </div>
</div>
