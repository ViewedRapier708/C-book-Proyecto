<div class="container-libros">
    <h2>Registro de Nuevo Libro</h2>
    
    <div class="layout-dos-columnas">
        <!-- Columna Izquierda: Tabla y Formulario -->
        <div class="columna-principal">
            <div class="container-tabla">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Autor</th>
                                <th>Editorial</th>
                                <th>Carrera</th>
                                <th>Disponible</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>001</td>
                                <td>Algoritmos y Programación</td>
                                <td>Juan Pérez</td>
                                <td>McGraw Hill</td>
                                <td>Sistemas</td>
                                <td>5</td>
                                <td><button class="btn-editar">Editar</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="container-formulario">
                <div class="form-group">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" placeholder="Ingrese el título del libro">
                </div>
                <div class="form-group">
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" placeholder="Ingrese el autor del libro">
                </div>
                <div class="form-group">
                    <label for="editorial">Editorial:</label>
                    <input type="text" id="editorial" placeholder="Ingrese la editorial del libro">
                </div>
                <div class="form-group">
                    <label for="isbn">ISBN:</label>
                    <input type="text" id="isbn" placeholder="Ingrese el código ISBN">
                </div>
                <div class="form-group">
                    <label for="carrera">Carrera:</label>
                    <select id="carrera">
                        <option value="">Seleccione una carrera</option>
                        <option value="Sistemas Digitales">Sistemas Digitales</option>
                        <option value="Programación">Programación</option>
                        <option value="Mecatrónica">Mecatrónica</option>
                        <option value="Tronco Común">Tronco Común</option>
                    </select>
                </div>
            </div>
            
            <div class="container-btn-alta">
                <button class="btn-limpiar" id="btn-limpiar">Limpiar Campos</button>
                <button class="btn-alta" id="btn-agregar">Agregar Libro</button>
            </div>
        </div>
        
        <!-- Columna Derecha: Estadísticas -->
        <div class="columna-estadisticas">
            <div class="container-datos-sistema">
                <h3>Información del Sistema</h3>
                <div class="dato-item">
                    <span class="dato-label">Total Libros:</span>
                    <span class="dato-value">150</span>
                </div>
                <div class="dato-item">
                    <span class="dato-label">Disponibles:</span>
                    <span class="dato-value">132</span>
                </div>
                <div class="dato-item">
                    <span class="dato-label">Prestados:</span>
                    <span class="dato-value">15</span>
                </div>
                <div class="dato-item">
                    <span class="dato-label">En Revisión:</span>
                    <span class="dato-value">3</span>
                </div>
                <div class="dato-item">
                    <span class="dato-label">Última Actualización:</span>
                    <span class="dato-value">13/11/2025</span>
                </div>
            </div>
        </div>
    </div>
</div>
