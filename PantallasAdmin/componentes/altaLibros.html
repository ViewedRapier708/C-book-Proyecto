<div class="admin-cards-container">
    <h2>Gestión de Libros</h2>
    <div class="mensaje-alerta" id="mensaje-libros" hidden></div>

    <div class="admin-header">
        <div class="admin-filtros">
            <label for="filtro-libros">Filtrar:</label>
            <select id="filtro-libros" class="admin-filtro-select" onchange="filtrarLibros()">
                <option value="todos">Todos</option>
                <option value="disponible">Disponibles</option>
                <option value="no-disponible">No disponibles</option>
            </select>
            <input type="text" id="buscar-libros" class="admin-search-input" placeholder="Buscar título, autor, ISBN..." oninput="debouncedFiltrarLibros()">
            <span class="admin-contador" id="contador-libros"></span>
        </div>
        <div class="admin-acciones">
            <button class="btn-recargar" onclick="cargarLibros()">
                <i class="fas fa-sync-alt"></i> Recargar
            </button>
            <button class="btn-alta" id="btn-agregar">
                <i class="fas fa-plus"></i> Agregar Libro
            </button>
        </div>
    </div>

    <div class="admin-carousel" id="carousel-libros">
        <button class="admin-arrow admin-arrow-prev" onclick="anteriorPaginaLibros()" aria-label="Anterior">
            <i class="fas fa-chevron-left"></i>
        </button>
        
        <div class="admin-grid admin-grid-3" id="grid-libros">
            <!-- Carga dinámica de cards -->
        </div>
        
        <button class="admin-arrow admin-arrow-next" onclick="siguientePaginaLibros()" aria-label="Siguiente">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <div class="admin-paginacion" id="paginacion-libros">
        <div class="admin-paginacion-dots" id="paginacion-dots-libros"></div>
        <div class="admin-paginacion-contador" id="paginacion-contador-libros">0 / 0</div>
    </div>
</div>

<!-- MODAL - Formulario como ventana emergente -->
<div class="modal-overlay" id="modalFormulario">
    <div class="modal-contenido">
        <span class="modal-cerrar">&times;</span>
        <h3 id="modal-titulo">Nuevo Libro</h3>
        
        <div class="container-formulario">
            <input type="hidden" id="libro_id">
            <input type="hidden" id="ejemplar_id">
            <div class="form-group">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" placeholder="Ingrese el título del libro">
            </div>
            <div class="form-group">
                <label for="autor">Autor:</label>
                <input type="text" id="autor" placeholder="Ingrese el autor del libro">
            </div>
            <div class="form-group">
                <label for="clasificacion">Clasificación:</label>
                <input type="text" id="clasificacion" placeholder="Ingrese la clasificación">
            </div>
            <div class="form-group">
                <label for="isbn">ISBN:</label>
                <input type="text" id="isbn" placeholder="Ingrese el código ISBN">
            </div>
            <div class="form-group">
                <label for="tipo_material">Tipo de material:</label>
                <input type="text" id="tipo_material" placeholder="Ingrese el tipo de material">
            </div>
            <div class="form-group">
                <label for="codigo_barras">Código de barras:</label>
                <input type="text" id="codigo_barras" placeholder="Ingrese el código de barras">
            </div>
            <div class="form-group">
                <label for="numero_ejemplar">Número de ejemplar:</label>
                <input type="text" id="numero_ejemplar" placeholder="Ingrese el número de ejemplar">
            </div>
            <div class="form-group">
                <label for="anio">Año:</label>
                <input type="number" id="anio" placeholder="Ingrese el año">
            </div>
            <div class="form-group">
                <label for="estatus_item">Estatus:</label>
                <input type="text" id="estatus_item" placeholder="Ingrese el estatus">
            </div>
            <div class="form-group">
                <label for="disponible">Disponible:</label>
                <select id="disponible">
                    <option value="true">Sí</option>
                    <option value="false">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="coleccion">Colección:</label>
                <input type="text" id="coleccion" placeholder="Ingrese la colección">
            </div>
        </div>
        
        <div class="modal-botones">
            <button class="btn-limpiar" id="btn-limpiar">Limpiar</button>
            <button class="btn-guardar" id="btn-guardar">Guardar</button>
        </div>
    </div>
</div>
