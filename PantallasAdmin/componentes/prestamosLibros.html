<div class="container-prestamos">
    <h2>Préstamos de Libros Activos</h2>
    
    <div class="layout-dos-columnas">
        <div class="columna-tabla">
            <div class="container-tabla">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID Préstamo</th>
                                <th>Boleta</th>
                                <th>Nombre Completo</th>
                                <th>Grupo</th>
                                <th>Correo</th>
                                <th>Libro</th>
                                <th>Ejemplar</th>
                                <th>Fecha Inicio</th>
                                <th>Fecha Entrega (Límite)</th>
                                <th>Estado</th>
                                <th>Devuelto</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-prestamos-libros">
                            <!-- Carga dinámica -->
                        </tbody>
                    </table>
                </div>
            </div>
             <div class="paginacion">
                <button class="btn-recargar" onclick="cargarPrestamosLibros()">
                    <i class="fas fa-sync-alt"></i> Recargar
                </button>
            </div>
        </div>
    </div>
</div>
