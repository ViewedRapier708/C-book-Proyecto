<div class="container-solicitudes">
    <h2>Alumnos Solicitantes de Libros</h2>
    
    <div class="layout">
        <div class="columna-tabla">
            <div class="container-tabla">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Boleta</th>
                                <th>Nombre Completo</th>
                                <th>Grupo</th>
                                <th>Correo</th>
                                <th>Documentación</th>
                                <th>Libro Solicitado</th>
                                <th>Fecha Solicitud</th>
                                <th>Fecha Límite Recolección</th>
                                <th>Estado</th>
                                <th>Devuelto</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-solicitudes-libros">
                            <!-- Carga dinámica -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="paginacion">
                <button class="btn-recargar" onclick="cargarSolicitudesLibros()">
                    <i class="fas fa-sync-alt"></i> Recargar
                </button>
            </div>
        </div>
    </div>
</div>
