<div class="container-solicitudes-libros-vertical container-solicitudes-wide">
    <h2>Solicitudes de Libros</h2>
    
    <div class="solicitudes-header">
        <button class="btn-recargar" onclick="cargarSolicitudesLibros()">
            <i class="fas fa-sync-alt"></i> Recargar
        </button>
    </div>
    
    <div class="solicitudes-carousel">
        <button class="carousel-arrow carousel-prev" onclick="anteriorPaginaSolicitud()" aria-label="Anterior">
            <i class="fas fa-chevron-left"></i>
        </button>
        
        <div class="solicitudes-grid" id="tabla-solicitudes-libros">
            <!-- Carga dinámica de tarjetas -->
        </div>
        
        <button class="carousel-arrow carousel-next" onclick="siguientePaginaSolicitud()" aria-label="Siguiente">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>
    
    <div class="solicitudes-paginacion">
        <div class="paginacion-dots" id="solicitudes-dots"></div>
        <div class="paginacion-contador" id="solicitudes-contador">0 / 0</div>
    </div>
</div>
