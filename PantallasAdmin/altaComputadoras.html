<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Computadoras</title>
    <link rel="stylesheet" href="css/altacompus.css">
</head>
<body>
    <div class="container-main">
        <div class="container-aside">
            <aside>
                <div class="container-logos">
                    <div class="logo-cuenta"><img src="" alt=""></div>
                    <div class="logo-containerBTZ"><img src="" alt=""></div>
                </div>
                <div class="container-entrada">
                    <hr class="linea-aside">
                    <br>
                    <hr class="linea-aside">
                    <div class="menu-interactivo">
                        <div class="btn-secciones">
                            <h2>Altas</h2>
                            <button><a href="" class="link-secciones">Computadoras</a></button>
                            <br>
                            <button><a href="" class="link-secciones">Restiradores</a></button>
                            <br>
                            <button><a href="" class="link-secciones">Area de Consulta</a></button>
                            <br>
                            <button><a href="" class="link-secciones">Solicion de Prestamos</a></button>
                            <h2>Solicitudes</h2>
                            <button><a href="" class="link-secciones">Libros</a></button>
                            <br>
                            <button><a href="" class="link-secciones">Documentos</a></button>
                            <br>
                            <button><a href="" class="link-secciones">Registros de alumnos que han ingresado</a></button>
                        </div>
                        <br>
                        <div class="btn-cerrar-sesion">
                            <button><a href="" class="link-secciones">Cerrar Sesión</a></button>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
        <div class="container-libros">
            <h2>LISTA DE COMPUTADORAS EXISTENTES</h2>
            <div class="container-tabla_libros">
                <table>
                    <thead>
                        <tr>
                            <th>No. Computadora</th>
                            <th>Procesador</th>
                            <th>Programas</th>
                            <th>Carrera</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="input-agg_lib">
            <label for="">Procesador: <input type="text" placeholder="Ingrese el procesador de la computadora"></label><br>
            <label for="">Programas: <input type="text" placeholder="Ingrese los programas de la computadora"></label><br>
            <label for="">Carrera: <input type="text" placeholder="Ingrese la carrera de la computadora"></label><br>
        </div>
        <br>
        <div>
            <button id="btn-limpiar" class="btn-limpiar">Limpiar Campos</button>
            <button id="btn-agregarLibro" class="btn-agregar">Agregar Libro</button>
        </div>
    </div>
</body>
</html>
