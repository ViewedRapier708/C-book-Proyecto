<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta De Restiradores</title>
    <link rel="stylesheet" href="css/asidepostadmin.css">
    <link rel="stylesheet" href="css/altarestir.css">
        <link rel="shortcut icon" href="/C-book-Proyecto/img/logo_C_Book.jpg" type="image/x-icon">
</head>
<body>
    <div class="container-main">
        <div class="container-aside">
            <aside>
                <div class="container-logos">
                    <div class="logo-cuenta"><img src="../img/logo_C_Book.jpg" alt="Logo C-Book"></div>
                    <div class="logo-containerBTZ"><img src="../img/logo-BTZ.png" alt="Logo BTZ"></div>
                </div>
                <div class="container-entrada">
                    <hr class="linea-aside">
                    <h2>ADMINISTRADOR</h2>
                    <hr class="linea-aside">
                    <div class="menu-interactivo">
                        <div class="btn-secciones">
                            <h2>Altas</h2>
                            <button><a href="altaComputadoras.html" class="link-secciones">Computadoras</a></button>
                            <button><a href="AltaLibros.html" class="link-secciones">Libros</a></button>
                            <button><a href="AltaRestiradores.html" class="link-secciones">Restiradores</a></button>
                            <button><a href="AltaGuardaropas.html" class="link-secciones">Guardaropas</a></button>
                            
                            <h2>Solicitudes</h2>
                            <button><a href="solicitudesAlumnosLib.html" class="link-secciones">Libros</a></button>
                             <!-- Aquí  van las consultas después de conectarlo con el Back
                            <h2>Consultas</h2>
                            <button><a href="" class="link-secciones">Alumnos Registrados</a></button>
                            <button><a href="" class="link-secciones">Historial Préstamos</a></button>
                            -->
                        </div>
                        <div class="btn-cerrar-sesion">
                            <button><a href="../index.html" class="link-secciones">Cerrar Sesión</a></button>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
        
        <div class="container-informacion">
            <div class="container-titulo">
                <h1>ALTA DE RESTIRADORES</h1>
            </div>
            
            <div class="container-contenido">
                <div class="container-restiradores">
                    <h2>Registro de Nuevos Restiradores</h2>
                    
                    <div class="layout">
                        <!-- Tabla en el centro (columna izquierda del layout) -->
                        <div class="container-tabla">
                            <div class="table-responsive">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>No.</th>
                                            <th>Ubicación</th>
                                            <th>Tipo</th>
                                            <th>Tamaño</th>
                                            <th>Estado</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>R001</td>
                                            <td>Aula 101</td>
                                            <td>Madera</td>
                                            <td>Grande</td>
                                            <td>Disponible</td>
                                            <td><button class="btn-editar">Editar</button></td>
                                        </tr>
                                        <!-- Más filas aquí -->
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Inputs a la derecha -->
                        <div class="container-formulario">
                            <div class="form-group">
                                <label for="cantidad">Cantidad a Agregar:</label>
                                <input type="number" id="cantidad" placeholder="Ingrese la cantidad" min="1">
                            </div>
                           
                            <div class="form-group">
                                <label for="estado">Estado Inicial:</label>
                                <select id="estado">
                                    <option value="disponible">Disponible</option>
                                    <option value="mantenimiento">En Mantenimiento</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Información de restiradores abajo de todo -->
                    <div class="container-datos-restiradores">
                        <h3>Estadísticas Restiradores</h3>
                        <div class="dato-item">
                            <span class="dato-label">Total Restiradores:</span>
                            <span class="dato-value">75</span>
                        </div>
                        <div class="dato-item">
                            <span class="dato-label">Disponibles:</span>
                            <span class="dato-value">62</span>
                        </div>
                        <div class="dato-item">
                            <span class="dato-label">En Uso:</span>
                            <span class="dato-value">10</span>
                        </div>
                        <div class="dato-item">
                            <span class="dato-label">Mantenimiento:</span>
                            <span class="dato-value">3</span>
                        </div>
                        <div class="dato-item">
                            <span class="dato-label">Última Actualización:</span>
                            <span class="dato-value">29/10/2025</span>
                        </div>
                    </div>
                    
                    <div class="container-btn-alta">
                        <button class="btn-limpiar" id="btn-limpiar">Limpiar Campos</button>
                        <button class="btn-alta" id="btn-agregar">Agregar Restiradores</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
