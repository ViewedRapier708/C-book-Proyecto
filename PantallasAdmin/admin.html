<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base-url" content="http://127.0.0.1:3000">
    <title>Panel Administrador - C-Book</title>
    <link rel="stylesheet" href="css/EstiloAsideAdmin.css">
    <link rel="stylesheet" href="css/StyleGeneralAdmin.css">
    <link rel="stylesheet" href="css/componentes-base.css">
    <link rel="stylesheet" href="css/componentes/altaLibros.css">
    <link rel="stylesheet" href="css/componentes/altaComputadoras.css">
    <link rel="stylesheet" href="css/componentes/altaRestiradores.css">
    <link rel="stylesheet" href="css/componentes/altaUsuarios.css">
    <link rel="shortcut icon" href="../img/logo_C_Book.jpg" type="image/x-icon">
    <script src="../js/config/apiConfig.js"></script>
    <script src="../js/auth/funcionCerrarSesion.js"></script>
</head>
<body>
    <nav class="navbar-top">
        <div class="navbar-brand">
            <a href="../pantallasUs/cuenta.html" id="linkCuenta">
                <img src="../img/logo-BTZ.png" alt="Logo BTZ" class="navbar-logo">
            </a>
            <span class="navbar-title">C-BOOK ADMIN</span>
        </div>
        <div class="navbar-links">
            <div class="navbar-dropdown">
                <button class="navbar-dropdown-toggle">Altas</button>
                <div class="navbar-dropdown-menu">
                    <a href="#" class="nav-link" data-component="altaComputadoras" data-title="ALTA DE COMPUTADORAS">Computadoras</a>
                    <a href="#" class="nav-link" data-component="altaLibros" data-title="ALTA DE LIBROS">Libros</a>
                    <a href="#" class="nav-link" data-component="altaRestiradores" data-title="ALTA DE RESTIRADORES">Restiradores</a>
                    <a href="#" class="nav-link" data-component="usuarios" data-title="USUARIOS DEL SISTEMA">Usuarios</a>
                </div>
            </div>
            <div class="navbar-dropdown">
                <button class="navbar-dropdown-toggle">Solicitudes</button>
                <div class="navbar-dropdown-menu">
                    <a href="#" class="nav-link" data-component="solicitudesLibros" data-title="SOLICITUDES DE LIBROS">Solicitudes Libros</a>
                    <a href="#" class="nav-link" data-component="prestamosLibros" data-title="PRÉSTAMOS DE LIBROS">Préstamos Libros</a>
                </div>
            </div>
        </div>
        <div class="navbar-actions">
            <a href="#" class="navbar-logout" onclick="cerrarSesion(); return false;">Cerrar Sesion</a>
        </div>
    </nav>

    <div class="container-main">
        <!-- Contenedor dinámico -->
        <div class="container-informacion">
            <div class="container-titulo">
                <h1 id="page-title">BIENVENIDO ADMINISTRADOR ¿QUÉ VAMOS A HACER HOY?</h1>
            </div>
            
            <div class="container-contenido" id="content-loader">
                <div class="container-inicio-admin">
                    <h1>BIENVENIDO ADMINISTRADOR ¿QUÉ VAMOS A HACER HOY?</h1>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación genérico -->
    <div class="modal-overlay" id="modalConfirmacion">
        <div class="modal-contenido">
            <span class="modal-cerrar" id="modal-confirmacion-cerrar">&times;</span>
            <h3 id="modal-confirmacion-titulo">Confirmación</h3>
            <div class="container-formulario">
                <p id="modal-confirmacion-mensaje"></p>
                <div class="detalle-confirmacion" id="modal-confirmacion-detalle"></div>
            </div>
            <div class="modal-botones">
                <button class="btn-limpiar" id="modal-confirmacion-cancelar">Cancelar</button>
                <button class="btn-guardar" id="modal-confirmacion-aceptar">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/apiAdmin.js"></script>
    <script src="js/adminLoader.js"></script>
    <script>
        (function() {
            document.querySelectorAll('.navbar-dropdown-toggle').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var dropdown = btn.closest('.navbar-dropdown');
                    document.querySelectorAll('.navbar-dropdown.open').forEach(function(d) {
                        if (d !== dropdown) d.classList.remove('open');
                    });
                    dropdown.classList.toggle('open');
                });
            });
            document.addEventListener('click', function() {
                document.querySelectorAll('.navbar-dropdown.open').forEach(function(d) {
                    d.classList.remove('open');
                });
            });
        })();
    </script>
</body>
</html>
