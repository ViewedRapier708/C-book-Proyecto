<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base-url" content="http://127.0.0.1:3000">
    <title>Panel Administrador - C-Book</title>
    <link rel="stylesheet" href="css/EstiloAsideAdmin.css">
    <link rel="stylesheet" href="css/StyleGeneralAdmin.css">
    <link rel="stylesheet" href="css/componentes-base.css">
    <link rel="stylesheet" href="css/componentes/altaLibros.css">
    <link rel="stylesheet" href="css/componentes/altaComputadoras.css">
    <link rel="stylesheet" href="css/componentes/altaRestiradores.css">
    <link rel="stylesheet" href="css/componentes/altaUsuarios.css">
    <link rel="shortcut icon" href="../img/logo_C_Book.jpg" type="image/x-icon">
    <script src="../js/config/apiConfig.js"></script>
</head>
<body>
    <aside class="container-aside">
        <div class="container-logos">
            <a href="../pantallasUs/cuenta.html" id="linkCuenta">
                <div class="logo-containerBTZ"><img src="../img/logo-BTZ.png" alt="Logo BTZ"></div>
            </a>
        </div>
        <div class="container-entrada">
            <hr class="linea-aside">
            <h2>ADMINISTRADOR</h2>
            <hr class="linea-aside">
            <div class="menu-interactivo">
                <div class="btn-secciones">
                    
                    <h3>Altas</h3>
                    <a href="#" class="link-secciones nav-link" data-component="altaComputadoras" data-title="ALTA DE COMPUTADORAS">Computadoras</a>
                    <a href="#" class="link-secciones nav-link" data-component="altaLibros" data-title="ALTA DE LIBROS">Libros</a>
                    <a href="#" class="link-secciones nav-link" data-component="altaRestiradores" data-title="ALTA DE RESTIRADORES">Restiradores</a>
                    <a href="#" class="link-secciones nav-link" data-component="usuarios" data-title="USUARIOS DEL SISTEMA">Usuarios</a>
                    <h3>Solicitudes</h3>
                    <a href="#" class="link-secciones nav-link" data-component="solicitudesLibros" data-title="SOLICITUDES DE LIBROS">Solicitudes de Libros</a>
                    <a href="#" class="link-secciones nav-link" data-component="documentos" data-title="SOLICITUDES DE DOCUMENTOS">Prestamos</a>
                </div>
                <div class="btn-cerrar-sesion">
                    <a href="../index.html" class="link-secciones">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </aside>

    <div class="container-main">
        <!-- Contenedor dinámico -->
        <div class="container-informacion">
            <div class="container-titulo">
                <h1 id="page-title">BIENVENIDO ADMINISTRADOR ¿QUÉ VAMOS A HACER HOY?</h1>
            </div>
            
            <div class="container-contenido" id="content-loader">
                <div class="container-inicio-admin">
                    <h1>BIENVENIDO ADMINISTRADOR ¿QUÉ VAMOS A HACER HOY?</h1>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación genérico -->
    <div class="modal-overlay" id="modalConfirmacion">
        <div class="modal-contenido">
            <span class="modal-cerrar" id="modal-confirmacion-cerrar">&times;</span>
            <h3 id="modal-confirmacion-titulo">Confirmación</h3>
            <div class="container-formulario">
                <p id="modal-confirmacion-mensaje"></p>
                <div class="detalle-confirmacion" id="modal-confirmacion-detalle"></div>
            </div>
            <div class="modal-botones">
                <button class="btn-limpiar" id="modal-confirmacion-cancelar">Cancelar</button>
                <button class="btn-guardar" id="modal-confirmacion-aceptar">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/apiAdmin.js"></script>
    <script src="js/adminLoader.js"></script>
</body>
</html>
